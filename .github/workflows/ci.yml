name: NEXUS-SLM CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop", "sprint/final-independent-validation" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-tests:
    name: Lint, Static Checks, and Automated Test Suite
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      matrix:
        python-version: ["3.10"]

    steps:
      - name: Free Disk Space on Runner
        run: |
          echo "=== Disk space before runner cleanup ==="
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          echo "=== Disk space after runner cleanup ==="
          df -h

      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Disk Diagnostics (Pre-Install)
        run: |
          echo "=== Disk space before dependency installation ==="
          df -h

      - name: Install CPU-only PyTorch
        run: |
          python -m pip install --no-cache-dir --upgrade pip
          python -m pip install --no-cache-dir "torch>=2.2.0" --index-url https://download.pytorch.org/whl/cpu
          python -c "import torch; print(f'Installed PyTorch: {torch.__version__}, CUDA: {torch.version.cuda}'); assert torch.version.cuda is None, 'Error: CUDA build detected!'"

      - name: Install CI Dependencies
        run: |
          python -m pip install --no-cache-dir -r requirements-ci.txt --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu
          python -m pip install --no-cache-dir --no-deps -e .

      - name: Verify Redis Asyncio Import
        run: |
          python -c "import redis; import redis.asyncio; print('Redis asyncio dependency verified:', redis.__version__)"

      - name: Disk Diagnostics & Environment Audit (Post-Install)
        run: |
          echo "=== Disk space after dependency installation ==="
          df -h
          echo "=== Pip cache size ==="
          du -sh ~/.cache/pip 2>/dev/null || echo "No pip cache found (cache disabled as expected)"
          echo "=== Top 15 largest installed packages in site-packages ==="
          SITE_PKG=$(python -c "import site; print(site.getsitepackages()[0])")
          du -sh $SITE_PKG/* 2>/dev/null | sort -hr | head -n 15 || true
          echo "=== Verify Dependency Consistency (pip check) ==="
          python -m pip check
          echo "=== Verify CPU-only PyTorch Build ==="
          python -c "import torch; print('PyTorch version:', torch.__version__); assert torch.version.cuda is None, 'CUDA detected'"

      - name: Python Syntax & Compilation Verification
        run: |
          python -m compileall src/ api/ scripts/ tests/

      - name: Run Full Automated Test Suite
        run: |
          pytest -v tests/

      - name: Verify Governance, Documentation Consistency & Provenance Manifests
        run: |
          python scripts/evaluation/check_documentation_consistency.py
          python scripts/deployment/generate_artifact_manifests.py --verify
          python scripts/data/human_eval_v2_manager.py validate

      - name: Verify Security & Secret Exclusion
        run: |
          # Ensure .env is not tracked in git
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "ERROR: .env file is tracked in git! Must be ignored."
            exit 1
          fi
          echo "Secret audit passed: No .env committed."

  docker-build:
    name: Container Build & Health Validation
    runs-on: ubuntu-latest
    needs: lint-and-tests

    steps:
      - name: Free Disk Space on Runner
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          df -h

      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build NEXUS-SLM Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: nexus-slm:ci-test

      - name: Generate Ephemeral Administrator Secret for CI
        run: |
          CI_ADMIN_KEY=$(python3 -c "import secrets; print(secrets.token_urlsafe(32))")
          echo "::add-mask::$CI_ADMIN_KEY"
          echo "CI_ADMIN_KEY=$CI_ADMIN_KEY" >> $GITHUB_ENV
          echo "Generated and masked cryptographically secure 256-bit ephemeral admin key for CI."

      - name: Start Container with Production Environment Configuration
        run: |
          docker run -d \
            --name nexus-ci-container \
            -p 8000:8000 \
            -e NEXUS_ENV=production \
            -e NEXUS_ENFORCE_ADMIN_AUTH=true \
            -e NEXUS_ADMIN_KEY="$CI_ADMIN_KEY" \
            -e ACTIVE_MODEL_VERSION=nexus-qlora-v1 \
            -e API_PORT=8000 \
            -e API_HOST=0.0.0.0 \
            nexus-slm:ci-test

      - name: Verify Container Startup & Health Check with Diagnostics
        run: |
          echo "Verifying container startup and probing health endpoint..."
          MAX_ATTEMPTS=20
          CONTAINER_READY=false

          for i in $(seq 1 $MAX_ATTEMPTS); do
            STATUS=$(docker inspect nexus-ci-container --format='{{.State.Status}}' 2>/dev/null || echo "not_found")
            if [ "$STATUS" = "exited" ] || [ "$STATUS" = "dead" ]; then
              EXIT_CODE=$(docker inspect nexus-ci-container --format='{{.State.ExitCode}}' 2>/dev/null || echo "unknown")
              echo "ERROR: Container exited unexpectedly with exit code: $EXIT_CODE"
              echo "=== Container Logs (last 200 lines) ==="
              docker logs --tail 200 nexus-ci-container
              exit 1
            fi

            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/health || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "Container is running and healthcheck passed (attempt $i/$MAX_ATTEMPTS, HTTP 200)!"
              CONTAINER_READY=true
              break
            fi

            echo "Waiting for API to initialize (attempt $i/$MAX_ATTEMPTS, status=$STATUS, http=$HTTP_CODE)..."
            sleep 2
          done

          if [ "$CONTAINER_READY" != "true" ]; then
            echo "ERROR: Timed out waiting for container health check."
            EXIT_CODE=$(docker inspect nexus-ci-container --format='{{.State.ExitCode}}' 2>/dev/null || echo "unknown")
            echo "Container status: $STATUS, exit code: $EXIT_CODE"
            echo "=== Container Logs (last 200 lines) ==="
            docker logs --tail 200 nexus-ci-container
            exit 1
          fi

          HEALTH_JSON=$(curl -s -f http://localhost:8000/health)
          echo "Health Response: $HEALTH_JSON"
          echo "$HEALTH_JSON" | grep -q '"status":"healthy"' || {
            echo "ERROR: Health check response does not contain '\"status\":\"healthy\"'"
            exit 1
          }

          READY_JSON=$(curl -s -f http://localhost:8000/ready)
          echo "Readiness Response: $READY_JSON"
          echo "$READY_JSON" | grep -q '"status":"ready"' || {
            echo "ERROR: Readiness check response does not contain '\"status\":\"ready\"'"
            exit 1
          }

          LIVE_JSON=$(curl -s -f http://localhost:8000/live)
          echo "Liveness Response: $LIVE_JSON"
          echo "$LIVE_JSON" | grep -q '"status":"alive"' || {
            echo "ERROR: Liveness check response does not contain '\"status\":\"alive\"'"
            exit 1
          }

      - name: Verify Inference API Functionality & Schema Conformance
        run: |
          echo "Executing real inference request against production container..."
          RESP=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"ticket": "My payment failed and account got debited twice"}')

          HTTP_CODE=$(echo "$RESP" | grep "HTTP_STATUS" | cut -d':' -f2)
          BODY=$(echo "$RESP" | sed '/HTTP_STATUS/d')

          echo "Inference HTTP Status: $HTTP_CODE"
          echo "Inference Response Body: $BODY"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "ERROR: Expected HTTP 200 from /predict, got $HTTP_CODE"
            docker logs --tail 50 nexus-ci-container
            exit 1
          fi

          # Verify required schema fields
          echo "$BODY" | grep -q '"category":' || { echo "ERROR: Missing 'category'"; exit 1; }
          echo "$BODY" | grep -q '"priority":' || { echo "ERROR: Missing 'priority'"; exit 1; }
          echo "$BODY" | grep -q '"language":' || { echo "ERROR: Missing 'language'"; exit 1; }
          echo "$BODY" | grep -q '"requires_human":' || { echo "ERROR: Missing 'requires_human'"; exit 1; }
          echo "$BODY" | grep -q '"request_id":' || { echo "ERROR: Missing 'request_id'"; exit 1; }
          echo "$BODY" | grep -q '"inference_mode":' || { echo "ERROR: Missing 'inference_mode'"; exit 1; }
          echo "Inference contract smoke test passed successfully."

          echo "Verifying Prometheus metrics & evaluation summary endpoints..."
          PROM_OUT=$(curl -s -f "http://localhost:8000/metrics?format=prometheus")
          echo "$PROM_OUT" | grep -q "nexus_requests_total" || { echo "ERROR: Missing Prometheus metric"; exit 1; }
          SUMMARY_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/evaluation/summary)
          if [ "$SUMMARY_CODE" != "200" ]; then
            echo "ERROR: Expected HTTP 200 from /evaluation/summary, got $SUMMARY_CODE"
            exit 1
          fi
          echo "Prometheus metrics and /evaluation/summary verified."

      - name: Verify Administrative Authentication Enforcement on Container
        run: |
          echo "Verifying administrative endpoint rejects unauthenticated request..."
          UNAUTH_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST "http://localhost:8000/model/rollback?target_version=baseline-smollm-135m")
          if [ "$UNAUTH_CODE" != "401" ]; then
            echo "ERROR: Expected HTTP 401 without auth, got $UNAUTH_CODE"
            exit 1
          fi
          echo "Verified: Missing credentials rejected with HTTP 401."

          echo "Verifying administrative endpoint rejects invalid credentials..."
          INVALID_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST "http://localhost:8000/model/rollback?target_version=baseline-smollm-135m" \
            -H "Authorization: Bearer wrong-admin-key-12345678901234567890")
          if [ "$INVALID_CODE" != "403" ]; then
            echo "ERROR: Expected HTTP 403 with invalid auth, got $INVALID_CODE"
            exit 1
          fi
          echo "Verified: Invalid credentials rejected with HTTP 403."

          echo "Verifying administrative endpoint accepts valid generated ephemeral key..."
          AUTH_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST "http://localhost:8000/model/rollback?target_version=nexus-qlora-v1" \
            -H "Authorization: Bearer $CI_ADMIN_KEY")
          if [ "$AUTH_CODE" != "200" ]; then
            echo "ERROR: Expected HTTP 200 with valid admin credentials, got $AUTH_CODE"
            exit 1
          fi
          echo "Verified: Valid administrative credentials accepted with HTTP 200."

      - name: Verify Graceful Shutdown & Inspect Container Logs
        if: always()
        run: |
          echo "Inspecting container state before stop..."
          STATUS=$(docker inspect nexus-ci-container --format='{{.State.Status}}' 2>/dev/null || echo "not_found")
          echo "Container status: $STATUS"

          if [ "$STATUS" = "running" ]; then
            echo "Issuing SIGTERM via docker stop..."
            docker stop --time 15 nexus-ci-container
          fi

          echo "=== Container Logs (last 100 lines) ==="
          docker logs --tail 100 nexus-ci-container 2>/dev/null || echo "No logs available"

          # Verify no secrets appear in logs
          if docker logs nexus-ci-container 2>&1 | grep -q "$CI_ADMIN_KEY"; then
            echo "SECURITY FAILURE: Ephemeral admin key leaked into container logs!"
            docker rm -f nexus-ci-container 2>/dev/null || true
            exit 1
          fi
          echo "Security audit passed: No administrative secrets found in container logs."

          docker rm -f nexus-ci-container 2>/dev/null || true

  build-dashboard:
    name: Build Next.js Dashboard
    runs-on: ubuntu-latest
    needs: lint-and-tests

    steps:
      - name: Free Disk Space on Runner
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          df -h

      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: dashboard/package.json

      - name: Install Dashboard Dependencies
        run: |
          cd dashboard
          npm install

      - name: Build Next.js Application
        run: |
          cd dashboard
          npm run build
