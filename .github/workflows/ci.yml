name: NEXUS-SLM CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-unit-tests:
    name: Lint, Unit Tests, and Integration Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10"]

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run Schema and Component Unit Tests
        run: |
          pytest -v tests/test_schemas.py tests/test_data_pipeline.py tests/test_parser.py tests/test_benchmarks.py

      - name: Run FastAPI Integration Tests
        run: |
          pytest -v tests/test_api.py

  evaluation-smoke-and-regression:
    name: Evaluation Smoke & Regression Gate
    runs-on: ubuntu-latest
    needs: lint-and-unit-tests

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: Run Dataset Pipeline Verification
        run: |
          python scripts/data/prepare_data.py --samples 100

      - name: Run Smoke Evaluation on Locked Test Set
        run: |
          python scripts/evaluation/run_evaluation.py --mode full

      - name: Check Evaluation Regression Thresholds
        run: |
          python -c "
          import json
          with open('experiments/artifacts/adversarial_report.json') as f:
              adv = json.load(f)
              assert adv['resistance_rate'] >= 0.80, f'Adversarial regression: {adv[\"resistance_rate\"]}'
          with open('experiments/artifacts/robustness_report.json') as f:
              rob = json.load(f)
              assert rob['overall_json_validity'] >= 0.95, f'JSON validity regression: {rob[\"overall_json_validity\"]}'
          print('All CI regression validation gates passed!')
          "

  build-dashboard:
    name: Build Next.js Dashboard
    runs-on: ubuntu-latest
    needs: lint-and-unit-tests

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: dashboard/package.json

      - name: Install Dashboard Dependencies
        run: |
          cd dashboard
          npm install

      - name: Build Next.js Application
        run: |
          cd dashboard
          npm run build
