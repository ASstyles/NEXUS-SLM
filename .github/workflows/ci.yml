name: NEXUS-SLM CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-tests:
    name: Lint, Static Checks, and Automated Test Suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10"]

    steps:
      - name: Free Disk Space on Runner
        run: |
          echo "=== Disk space before runner cleanup ==="
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          echo "=== Disk space after runner cleanup ==="
          df -h

      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Disk Diagnostics (Pre-Install)
        run: |
          echo "=== Disk space before dependency installation ==="
          df -h

      - name: Install CPU-only PyTorch
        run: |
          python -m pip install --no-cache-dir --upgrade pip
          python -m pip install --no-cache-dir "torch>=2.2.0" --index-url https://download.pytorch.org/whl/cpu
          python -c "import torch; print(f'Installed PyTorch: {torch.__version__}, CUDA: {torch.version.cuda}'); assert torch.version.cuda is None, 'Error: CUDA build detected!'"

      - name: Install CI Dependencies
        run: |
          python -m pip install --no-cache-dir -r requirements-ci.txt --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu
          python -m pip install --no-cache-dir --no-deps -e .

      - name: Disk Diagnostics & Environment Audit (Post-Install)
        run: |
          echo "=== Disk space after dependency installation ==="
          df -h
          echo "=== Pip cache size ==="
          du -sh ~/.cache/pip 2>/dev/null || echo "No pip cache found (cache disabled as expected)"
          echo "=== Top 15 largest installed packages in site-packages ==="
          SITE_PKG=$(python -c "import site; print(site.getsitepackages()[0])")
          du -sh $SITE_PKG/* 2>/dev/null | sort -hr | head -n 15 || true
          echo "=== Verify Dependency Consistency (pip check) ==="
          python -m pip check
          echo "=== Verify CPU-only PyTorch Build ==="
          python -c "import torch; print('PyTorch version:', torch.__version__); assert torch.version.cuda is None, 'CUDA detected'"

      - name: Python Syntax & Compilation Verification
        run: |
          python -m compileall src/ api/ scripts/ tests/

      - name: Run Full Automated Test Suite
        run: |
          pytest -v tests/

      - name: Verify Security & Secret Exclusion
        run: |
          # Ensure .env is not tracked in git
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "ERROR: .env file is tracked in git! Must be ignored."
            exit 1
          fi
          echo "Secret audit passed: No .env committed."

  docker-build:
    name: Container Build & Health Validation
    runs-on: ubuntu-latest
    needs: lint-and-tests

    steps:
      - name: Free Disk Space on Runner
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          df -h

      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build NEXUS-SLM Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: nexus-slm:ci-test

      - name: Start Container with Environment Configuration
        run: |
          docker run -d \
            --name nexus-ci-container \
            -p 8000:8000 \
            -e ACTIVE_MODEL_VERSION=nexus-qlora-v1 \
            -e API_PORT=8000 \
            -e API_HOST=0.0.0.0 \
            nexus-slm:ci-test

      - name: Verify Container Startup & Health Check
        run: |
          echo "Waiting for container startup and healthcheck..."
          for i in {1..30}; do
            if curl -s -f http://localhost:8000/health; then
              echo "Healthcheck passed!"
              break
            fi
            echo "Waiting for API to become ready (attempt $i/30)..."
            sleep 2
          done
          HEALTH_JSON=$(curl -s http://localhost:8000/health)
          echo "Health response: $HEALTH_JSON"
          echo "$HEALTH_JSON" | grep -q '"status":"healthy"' || exit 1

      - name: Verify Inference API Functionality
        run: |
          echo "Testing inference on container..."
          RESP=$(curl -s -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"ticket": "My payment failed and account got debited twice"}')
          echo "Inference response: $RESP"
          echo "$RESP" | grep -q '"category":' || exit 1
          echo "$RESP" | grep -q '"requires_human":' || exit 1

      - name: Verify Graceful Shutdown
        run: |
          echo "Issuing SIGTERM via docker stop..."
          docker stop --time 15 nexus-ci-container
          STATUS=$(docker inspect nexus-ci-container --format='{{.State.Status}}')
          echo "Container status after stop: $STATUS"
          docker logs nexus-ci-container | tail -n 20
          docker rm nexus-ci-container

  build-dashboard:
    name: Build Next.js Dashboard
    runs-on: ubuntu-latest
    needs: lint-and-tests

    steps:
      - name: Free Disk Space on Runner
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          df -h

      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: dashboard/package.json

      - name: Install Dashboard Dependencies
        run: |
          cd dashboard
          npm install

      - name: Build Next.js Application
        run: |
          cd dashboard
          npm run build
