# NEXUS-SLM Step 5 Genuine LoRA Training Configuration
experiment_name: "exp_002_qlora"
seed: 42

model:
  pretrained_model_name_or_path: "HuggingFaceTB/SmolLM-135M-Instruct"
  torch_dtype: "float32"
  device_map: "cpu"

quantization:
  load_in_4bit: false  # CPU runtime; genuine PEFT LoRA with frozen base weights

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  bias: "none"
  task_type: "CAUSAL_LM"
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"

training:
  output_dir: "./models/checkpoints/exp_002_qlora"
  num_train_epochs: 1
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 2
  learning_rate: 0.0005
  weight_decay: 0.01
  max_seq_length: 128
  logging_steps: 5
  eval_strategy: "epoch"
  save_strategy: "epoch"
  save_total_limit: 1

export:
  export_dir: "./models/nexus_qlora_v1"
  save_adapter_only: true
