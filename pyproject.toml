[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-slm"
version = "1.0.0"
description = "Neural EXecution for Unified Support Intelligence — Multilingual Support Ticket Triage SLM"
readme = "README.md"
authors = [{ name = "NEXUS-SLM AI Research Team" }]
license = { text = "Apache-2.0" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "torch>=2.2.0",
    "transformers>=4.44.0",
    "scikit-learn>=1.4.0",
    "numpy>=1.26.0,<2.1.0",
    "pandas>=2.2.0",
    "fastapi>=0.112.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "rich>=13.7.1",
    "pyyaml>=6.0.1",
    "requests>=2.32.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
training = [
    "datasets>=2.20.0",
    "peft>=0.12.0",
    "trl>=0.9.6",
    "accelerate>=0.33.0",
    "mlflow>=2.15.0",
    "bitsandbytes>=0.43.0; sys_platform != 'win32'",
]
quantization = [
    "optimum[onnxruntime]>=1.20.0",
    "onnxruntime>=1.18.0",
    "llama-cpp-python>=0.2.80",
]
test = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.8",
]

[project.scripts]
nexus-data = "src.data.pipeline:main"
nexus-train = "src.training.trainer:main"
nexus-eval = "src.evaluation.evaluator:main"
nexus-api = "api.main:start"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"

[tool.black]
line-length = 100
target-version = ["py310"]
